repos:
  - repo: local
    hooks:
      - id: local-cli-delegation-gate
        name: local-cli delegation unit/regression/e2e/coverage/performance gate
        entry: python scripts/pre_commit_local_cli_gate.py
        language: system
        pass_filenames: false
        files: ^(agent/local_cli_client\.py|tools/delegate_tool\.py|run_agent\.py|agent/auxiliary_client\.py|tests/agent/test_local_cli_client\.py|tests/tools/test_delegate\.py|scripts/pre_commit_local_cli_gate\.py|\.pre-commit-config\.yaml)$
      - id: memory-availability-gate
        name: cron/gateway memory unit/regression/e2e/performance gate
        entry: python scripts/pre_commit_memory_gate.py
        language: system
        pass_filenames: false
        files: ^(run_agent\.py|cron/scheduler\.py|gateway/run\.py|tests/agent/test_memory_prompt_suppression\.py|tests/gateway/test_agent_cache_memory_config\.py|tests/cron/test_scheduler\.py|scripts/pre_commit_memory_gate\.py|\.pre-commit-config\.yaml)$
      - id: run-graph-core-gate
        name: RunGraph core unit/regression gate
        entry: python -m pytest tests/agent/test_run_events.py tests/agent/test_run_graph.py tests/agent/test_run_event_store.py tests/agent/test_run_projection.py -q -o addopts=
        language: system
        pass_filenames: false
        files: ^(agent/run_events\.py|agent/run_graph\.py|agent/run_event_store\.py|agent/run_projection\.py|tests/agent/test_run_events\.py|tests/agent/test_run_graph\.py|tests/agent/test_run_event_store\.py|tests/agent/test_run_projection\.py|\.pre-commit-config\.yaml)$
